plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sahil.ripplefix'
    compileSdk 34

    defaultConfig {
        applicationId "com.sahil.ripplefix"
        minSdk 31
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        fixed {
            File ks = file("release.jks")
            if (!ks.exists()) {
                ["keytool", "-genkey", "-v", "-keystore", ks.absolutePath, "-keyalg", "RSA", "-keysize", "2048", "-validity", "10000", "-alias", "sahil", "-storepass", "sahil123", "-keypass", "sahil123", "-dname", "CN=Sahil Ansari, O=MarbleRippleFix, C=IN"].execute().waitFor()
            }
            storeFile ks
            storePassword "sahil123"
            keyAlias "sahil"
            keyPassword "sahil123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
