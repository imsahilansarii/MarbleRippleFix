plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sahil.ripplefix'
    compileSdk 34

    defaultConfig {
        applicationId "com.sahil.ripplefix"
        minSdk 31
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.create("fixed") { storeFile file("release.jks"); storePassword "sahil123"; keyAlias "sahil"; keyPassword "sahil123" }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
